
<!DOCTYPE html>
<html>
<head>
    <title>Sticky Navbar & Card Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2>My Website</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Card Overlay -->
    <div class="container">
        <div class="card">
            <img src="https://picsum.photos/300/200"
                 alt="Nature">

            <div class="overlay">
                <h2>Nature</h2>
                <p>Explore the beauty of nature.</p>
                <button>Read More</button>
            </div>
        </div>
    </div>

</body>
</html>
