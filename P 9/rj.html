
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navbar and Card Grid</title>
    <link rel="stylesheet" href="style1.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2>My Website</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Card Grid -->
    <section class="container">

        <div class="card">
            <img src="https://picsum.photos/300/200?1" alt="Nature">
            <h3>Nature</h3>
            <p>Explore the beauty of nature.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?2" alt="Technology">
            <h3>Technology</h3>
            <p>Learn about modern technology.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?3" alt="Travel">
            <h3>Travel</h3>
            <p>Discover beautiful places.</p>
            <button>Read More</button>
        </div>

    </section>

</body>
</html>
